# 临时探针：在 CI 的网络与密钥条件下验证「起因」字段质量。
#
# 与日报无关，只手动触发，跑完看完即删。
# - 只读权限，不提交任何东西
# - DATA_DIR 指向 runner 临时目录，source/news/data 不受影响
# - 运行策略在内存里切成 active（全文证据路径），config.yaml 不改
name: Cause Probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cause-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r news-pipeline/requirements.txt

      - name: Run pipeline with full-text evidence
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
          RSSHUB_KEY: ${{ secrets.RSSHUB_KEY }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          repo = Path.cwd()
          run_dir = Path(os.environ["RUNNER_TEMP"]) / "cause-probe-data"
          shutil.copytree(repo / "source" / "news" / "data", run_dir)
          os.environ["DATA_DIR"] = str(run_dir)
          os.environ.pop("ROLLOUT_EVIDENCE_PATH", None)

          sys.path.insert(0, str(repo / "news-pipeline"))
          import daily_news as dn

          original = dn.resolve_run_policy
          dn.resolve_run_policy = lambda cfg, args: {
              **original(cfg, args), "mode": "active",
              "full_objectivity": True, "writes_public_data": True}

          print(f"[probe] DATA_DIR={run_dir}", flush=True)
          dn.main()
          PY

      - name: Export causes
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          run_dir = Path(os.environ["RUNNER_TEMP"]) / "cause-probe-data"
          out = Path(os.environ["RUNNER_TEMP"]) / "causes.txt"
          daily = sorted((run_dir / "daily").glob("*.js"))
          if not daily:
              out.write_text("no payload produced\n", encoding="utf-8")
              raise SystemExit(0)

          raw = daily[-1].read_text(encoding="utf-8")
          payload = json.loads(raw[raw.index("] = ") + 4:].rstrip().rstrip(";"))
          picks = [i for i in payload["items"] if i.get("tier") == "pick"]
          withc = [i for i in picks if i.get("context")]
          cont = [i for i in withc if i.get("trusted_continuation") is True]

          causal = re.compile(
              r"(因|由于|导致|促使|引发|为了|试图|寻求|担忧|反制|回应|压力)")
          gloss = re.compile(
              r"^[^，。]{2,20}是[^，。]*(平台|模型|技术|指标|机构|系统|协议|框架|公司)"
              r"|，指")

          lines = [
              f"date={payload['date']}  picks={len(picks)}",
              f"with_context={len(withc)}  (来龙/延续={len(cont)}"
              f"  起因/新事件={len(withc) - len(cont)})",
              f"coverage={len(withc) / len(picks):.0%}" if picks else "coverage=n/a",
              "",
              "=" * 72,
          ]
          for item in withc:
              kind = "来龙" if item.get("trusted_continuation") is True else "起因"
              hint = []
              if causal.search(item["context"]):
                  hint.append("含因果词")
              if gloss.search(item["context"]):
                  hint.append("疑似名词解释")
              lines += [f"[{kind}] {item['title']}",
                        f"       {item['context']}",
                        f"       {'/'.join(hint) if hint else '—'}", ""]
          lines += ["=" * 72,
                    f"留空 {len(picks) - len(withc)} 条（来源未说明原因即留空是预期行为）:"]
          lines += [f"  - {i['title']}" for i in picks if not i.get("context")]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload causes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: causes
          path: ${{ runner.temp }}/causes.txt
          if-no-files-found: warn
          retention-days: 3
